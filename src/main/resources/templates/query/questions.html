<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doprecyzowanie zapytania</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">

        <a class="navbar-brand" th:href="@{/dashboard}">
            Menu
        </a>

        <div class="ms-auto d-flex align-items-center gap-2">

            <span class="text-white"
                  th:if="${session.loggedUser != null}">
                Zalogowany:
                <strong th:text="${session.loggedUser.userName}"></strong>
            </span>

            <a th:if="${session.loggedUser == null}"
               th:href="@{/user/login}"
               class="btn btn-light btn-sm">
                Logowanie
            </a>

            <a th:if="${session.loggedUser == null}"
               th:href="@{/user/save}"
               class="btn btn-outline-light btn-sm">
                Rejestracja
            </a>

            <a th:if="${session.loggedUser != null}"
               th:href="@{/user/logout}"
               class="btn btn-danger btn-sm">
                Wyloguj
            </a>

        </div>

    </div>
</nav>

<div class="container mt-4">

    <div class="card shadow-sm">
        <div class="card-body">

            <h3 class="mb-4">Doprecyzuj zapytanie</h3>

            <form th:action="@{/nlp/query/sql}" method="post">

                <div th:each="question : ${questions}" class="mb-3">

                    <label class="form-label"
                           th:text="${question}">
                    </label>

                    <input type="text"
                           name="answers"
                           class="form-control"
                           required>

                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        Wyślij
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
