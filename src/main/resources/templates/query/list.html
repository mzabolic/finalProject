<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historia SQL</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">

        <a class="navbar-brand" th:href="@{/dashboard}">
            Menu
        </a>

        <div class="ms-auto d-flex align-items-center gap-2">

            <span class="text-white"
                  th:if="${session.loggedUser != null}">
                Zalogowany:
                <strong th:text="${session.loggedUser.userName}"></strong>
            </span>

            <a th:if="${session.loggedUser == null}"
               th:href="@{/user/login}"
               class="btn btn-light btn-sm">
                Logowanie
            </a>

            <a th:if="${session.loggedUser == null}"
               th:href="@{/user/save}"
               class="btn btn-outline-light btn-sm">
                Rejestracja
            </a>

            <a th:if="${session.loggedUser != null}"
               th:href="@{/user/logout}"
               class="btn btn-danger btn-sm">
                Wyloguj
            </a>

        </div>

    </div>
</nav>

<div class="container">

    <div class="card shadow-sm">
        <div class="card-body">

            <h3 class="mb-4">
                Historia wygenerowanych zapytań SQL
            </h3>

            <div th:if="${#lists.isEmpty(sqls.content)}">
                <div class="alert alert-info">
                    Brak zapisanych zapytań.
                </div>
            </div>

            <div th:each="sql : ${sqls.content}"
                 class="card mb-3">

                <div class="card-body">

                    <h6 class="card-subtitle mb-2 text-muted">
                        ID: <span th:text="${sql.id}"></span>
                    </h6>

                    <pre class="bg-light p-3 rounded border"
                         th:text="${sql.sqlText}">
        </pre>

                    <form th:action="@{/nlp/query/exec}" method="post">

                        <input type="hidden"
                               name="sql"
                               th:value="${sql.sqlText}">

                        <button type="submit"
                                class="btn btn-success">
                            <i class="bi bi-play-fill"></i>
                            Execute
                        </button>

                    </form>

                </div>

            </div>

            <nav th:if="${sqls.totalPages > 1}">
                <ul class="pagination justify-content-center">

                    <li class="page-item"
                        th:classappend="${sqls.first} ? 'disabled'">

                        <a class="page-link"
                           th:href="@{/historySql/list(page=${sqls.number - 1})}">
                            Poprzednia
                        </a>
                    </li>

                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, sqls.totalPages - 1)}"
                        th:classappend="${i == sqls.number} ? 'active'">

                        <a class="page-link"
                           th:text="${i + 1}"
                           th:href="@{/historySql/list(page=${i})}">
                        </a>

                    </li>

                    <li class="page-item"
                        th:classappend="${sqls.last} ? 'disabled'">

                        <a class="page-link"
                           th:href="@{/historySql/list(page=${sqls.number + 1})}">
                            Następna
                        </a>
                    </li>

                </ul>
            </nav>

        </div>
    </div>

</div>

</body>
</html>
