<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" xmlns="">
<head>
    <meta charset="UTF-8"/>
    <title>Wynik zapytania</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">

        <a class="navbar-brand" th:href="@{/dashboard}">
            Menu
        </a>

        <div class="ms-auto d-flex align-items-center gap-2">

            <span class="text-white"
                  th:if="${session.loggedUser != null}">
                Zalogowany:
                <strong th:text="${session.loggedUser.userName}"></strong>
            </span>

            <a th:if="${session.loggedUser == null}"
               th:href="@{/user/login}"
               class="btn btn-light btn-sm">
                Logowanie
            </a>

            <a th:if="${session.loggedUser == null}"
               th:href="@{/user/save}"
               class="btn btn-outline-light btn-sm">
                Rejestracja
            </a>

            <a th:if="${session.loggedUser != null}"
               th:href="@{/user/logout}"
               class="btn btn-danger btn-sm">
                Wyloguj
            </a>

        </div>

    </div>
</nav>

<div class="container">

    <div class="card shadow-sm mb-4">
        <div class="card-header">
            <h4 class="mb-0">Wygenerowane zapytanie SQL</h4>
        </div>
        <div class="card-body">
            <code th:text="${sql}">
                SELECT * FROM store
            </code>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 m-0">Wynik zapytania</h1>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">

            <thead class="table-light">
            <tr>
                <th th:each="column : ${result.queryResult.columns}"
                    th:text="${column}">
                </th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="row : ${result.queryResult.rows}">
                <td th:each="cell : ${row}"
                    th:text="${cell}">
                </td>
            </tr>
            </tbody>

        </table>
    </div>

    <div class="mt-3">
        <a class="btn btn-secondary"
           th:href="@{/dashboard}">
            <i class="bi bi-arrow-left"></i>
            Powrót do menu
        </a>
    </div>
    <div>
        <strong>Dostępne wizualizacje:</strong>

        <span th:each="type : ${result.visualizationTypes}">
        <span th:text="${type}"></span>
    </span>
    </div>
    <div class="card shadow-sm mt-4"
         th:if="${result.chartData != null}">

        <div class="card-header">
            <h5 class="mb-0">Wizualizacja danych</h5>
        </div>

        <div class="card-body">

            <div class="mb-3">
                <strong>Dostępne wizualizacje:</strong>

                <div class="mt-2 d-flex gap-2">

                    <button th:each="type : ${result.visualizationTypes}"
                            th:if="${type.name() != 'TABLE' and type.name() != 'METRIC'}"
                            type="button"
                            class="btn btn-outline-primary chart-btn"
                            th:attr="data-type=${type.name()}"
                            th:text="${type.name()}">
                    </button>

                </div>
            </div>

            <div style="height:500px">
                <canvas id="resultChart"></canvas>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script th:inline="javascript">

        const chartData = /*[[${result.chartData}]]*/ null;

        let chartInstance = null;

        const colors = [
            '#0d6efd',
            '#dc3545',
            '#198754',
            '#ffc107',
            '#6f42c1',
            '#fd7e14'
        ];

        function convertType(type) {

            switch (type) {

                case 'BAR_CHART':
                    return 'bar';

                case 'LINE_CHART':
                case 'MULTI_LINE':
                    return 'line';

                case 'PIE_CHART':
                    return 'pie';

                default:
                    return 'bar';
            }
        }

        function renderChart(type) {

            const labels = chartData.labels;

            const datasets = chartData.dataSets.map((dataSet, index) => ({

                label: dataSet.label,

                data: dataSet.values,

                borderWidth: 2,

                borderColor: colors[index % colors.length],

                backgroundColor:
                    type === 'pie'
                        ? colors
                        : colors[index % colors.length],

                fill: false
            }));

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(
                document.getElementById('resultChart'),
                {
                    type: type,

                    data: {
                        labels: labels,
                        datasets: datasets
                    },

                    options: {
                        responsive: true,
                        maintainAspectRatio: false
                    }
                }
            );
        }

        document.querySelectorAll('.chart-btn')
            .forEach(button => {

                button.addEventListener('click', () => {

                    document.querySelectorAll('.chart-btn')
                        .forEach(b => {
                            b.classList.remove('btn-primary');
                            b.classList.add('btn-outline-primary');
                        });

                    button.classList.remove('btn-outline-primary');
                    button.classList.add('btn-primary');

                    renderChart(
                        convertType(button.dataset.type)
                    );
                });
            });

        const firstButton =
            document.querySelector('.chart-btn');

        if(firstButton){
            firstButton.click();
        }

    </script>


</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
