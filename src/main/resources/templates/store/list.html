<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Sklepy</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Custom CSS -->
    <!--    <link rel="stylesheet" th:href="@{/css/style.css}">-->
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">

        <a class="navbar-brand" th:href="@{/dashboard}">
            Menu
        </a>

        <div class="ms-auto d-flex align-items-center gap-2">

            <span class="text-white"
                  th:if="${session.loggedUser != null}">
                Zalogowany:
                <strong th:text="${session.loggedUser.userName}"></strong>
            </span>

            <a th:if="${session.loggedUser == null}"
               th:href="@{/user/login}"
               class="btn btn-light btn-sm">
                Logowanie
            </a>

            <a th:if="${session.loggedUser == null}"
               th:href="@{/user/save}"
               class="btn btn-outline-light btn-sm">
                Rejestracja
            </a>

            <a th:if="${session.loggedUser != null}"
               th:href="@{/user/logout}"
               class="btn btn-danger btn-sm">
                Wyloguj
            </a>

        </div>

    </div>
</nav>

<div class="container">
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}">Operacja zakończona sukcesem.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Zamknij"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 m-0">Lista sklepow</h1>
        <a class="btn btn-success" th:href="@{/stores/new}">
            <i class="bi bi-plus-lg"></i> Dodaj nowy
        </a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>storeNumber</th>
                <th>city</th>
                <th>state</th>
                <th>type</th>
                <th>cluster</th>

                <th class="text-end">Akcje</th>
            </tr>
            </thead>
            <tbody>

            <tr th:each="s : ${stores.content}">
                <td th:text="${s.storeNumber}">1</td>
                <td th:text="${s.city}">Miasto</td>
                <td th:text="${s.state}">Region</td>
                <td th:text="${s.type}">type</td>
                <td th:text="${s.cluster}">cluster</td>
                <td class="text-end">

                    <a class="btn btn-sm btn-outline-secondary" th:href="@{|/stores/${s.storeNumber}/edit|}">Edytuj</a>
                    <a class="btn btn-sm btn-outline-danger data-confirm" th:href="@{|/stores/${s.storeNumber}/delete|}">Usuń</a>
                </td>
            </tr>
            </tbody>
        </table>
        <nav>
            <ul class="pagination">

                <li class="page-item"
                    th:classappend="${stores.first} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/stores/list(page=${stores.number - 1})}">
                        Poprzednia
                    </a>
                </li>

                <li class="page-item disabled">
            <span class="page-link">
                Strona [[${stores.number + 1}]] z [[${stores.totalPages}]]
            </span>
                </li>

                <li class="page-item"
                    th:classappend="${stores.last} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/stores/list(page=${stores.number + 1})}">
                        Następna
                    </a>
                </li>

            </ul>
        </nav>
    </div>
</div>

<!-- Bootstrap JS (bundle z Popperem) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Bootstrap Icons (opcjonalnie do ikonki plusa) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<!-- Custom JS -->
<script th:src="@{/js/app.js}"></script>
</body>
</html>
