<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">

        <a class="navbar-brand" th:href="@{/dashboard}">
            Menu
        </a>

        <div class="ms-auto d-flex align-items-center gap-2">

            <span class="text-white"
                  th:if="${session.loggedUser != null}">
                Zalogowany:
                <strong th:text="${session.loggedUser.userName}"></strong>
            </span>

            <a th:if="${session.loggedUser == null}"
               th:href="@{/user/login}"
               class="btn btn-light btn-sm">
                Logowanie
            </a>

            <a th:if="${session.loggedUser == null}"
               th:href="@{/user/save}"
               class="btn btn-outline-light btn-sm">
                Rejestracja
            </a>

            <a th:if="${session.loggedUser != null}"
               th:href="@{/user/logout}"
               class="btn btn-danger btn-sm">
                Wyloguj
            </a>

        </div>

    </div>
</nav>
<div class="container">

    <div class="card shadow-sm">
        <div class="card-body">
            <form  th:action="@{/stores/new}" th:object="${store}" method="post">

                <input type="hidden" name="isEdit" th:value="${isEdit}">

                <div class="mb-3">
                    <label class="form-label">Numer sklepu</label>
                    <input type="text" class="form-control"
                           th:classappend="${#fields.hasErrors('storeNumber')} ? ' is-invalid' : (${isEdit} ? ' bg-light' : '')"
                           th:field="*{storeNumber}" th:readonly="${isEdit}" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('storeNumber')}" th:errors="*{storeNumber}">Błąd</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Miasto</label>
                    <input type="text" class="form-control"
                           th:classappend="${#fields.hasErrors('city')} ? ' is-invalid'"
                           th:field="*{city}" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('city')}" th:errors="*{city}">Błąd</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">State</label>
                    <input type="text" class="form-control"
                           th:classappend="${#fields.hasErrors('state')} ? ' is-invalid'"
                           th:field="*{state}" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('state')}" th:errors="*{state}">Błąd</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Typ</label>
                    <input type="text" class="form-control"
                           th:classappend="${#fields.hasErrors('type')} ? ' is-invalid'"
                           th:field="*{type}" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('type')}" th:errors="*{type}">Błąd</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">cluster</label>
                    <input type="text" class="form-control"
                           th:classappend="${#fields.hasErrors('cluster')} ? ' is-invalid'"
                           th:field="*{cluster}" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('cluster')}" th:errors="*{cluster}">Błąd</div>
                </div>



                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Zapisz</button>
                    <a th:href="@{/stores/list}" class="btn btn-outline-secondary">Anuluj</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
